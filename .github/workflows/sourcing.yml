name: Sourcing run

# Cloud "Run" button: Actions tab -> "Sourcing run" -> Run workflow.
# Also runnable on a schedule (uncomment below). Uses the runner's built-in
# GITHUB_TOKEN (lifts GitHub API rate limits) and the heuristic scorer by
# default, so it needs ZERO secrets. Add GROQ_API_KEY as a repo secret only
# if you want LLM-written rationales (set scorer: groq when launching).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Candidates per source"
        default: "40"
      scorer:
        description: "Scorer provider (heuristic / groq / auto)"
        default: "heuristic"
  schedule:
    # Daily, unattended, heuristic scorer (zero secrets required to run — Slack delivery below
    # is separately optional). Change the cron to retime it; https://crontab.guru helps.
    - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (live extras)
        run: pip install -e ".[live]"

      - name: Run sourcing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # auto-provided by Actions
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}          # optional; used only if scorer=groq/auto
          SIGNAL_LLM_PROVIDER: ${{ github.event.inputs.scorer || 'heuristic' }}
        run: |
          PYTHONPATH=src python -m signalfund --limit "${{ github.event.inputs.limit || '40' }}"

      - name: Show digest in the run summary
        if: always()
        run: |
          echo "### Signal digest" >> "$GITHUB_STEP_SUMMARY"
          cat out/digest.md >> "$GITHUB_STEP_SUMMARY" || echo "(no digest produced)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest + dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-digest
          path: |
            out/digest.md
            out/digest.json
            out/dashboard.html
            out/source_health.json

      - name: Deliver digest to Slack
        # Optional: add a SLACK_WEBHOOK_URL repo secret (Slack -> your channel -> Incoming
        # Webhooks) to get the top candidates posted automatically. No secret -> this step
        # just logs the message and exits 0 (same "missing key -> skip" rule every other
        # source follows). A webhook that fails to deliver DOES fail this step, which fails
        # the job — that's the alert; GitHub already notifies you on a failed scheduled run.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: PYTHONPATH=src python scripts/notify_slack.py
